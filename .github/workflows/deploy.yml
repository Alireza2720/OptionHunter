name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 10m
          script: |
            set -e
            cd ~/apps/OptionHunter
            echo "=== Fetching ==="
            git fetch origin main
            echo "=== Reset ==="
            git reset --hard origin/main
            echo "=== Clean ==="
            git clean -fd -e ecosystem.config.js -e package-lock.json -e node_modules -e .env -e logs
            echo "=== npm install ==="
            npm install --prefix . --no-audit --no-fund --prefer-offline --loglevel=error
            echo "=== PM2 restart ==="
            pm2 startOrRestart ecosystem.config.js --update-env
            pm2 save
            echo "=== Done ==="