name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 10m
          script: |
            set -e
            cd ~/apps/OptionHunter

            # 🔒 بکاپ .env قبل از هر کاری
            if [ -f .env ]; then
              cp .env /tmp/optionhunter.env.backup
              echo "✅ .env backed up"
            fi

            echo "=== Fetch ==="
            git fetch origin main
            git reset --hard origin/main

            echo "=== Clean ==="
            git clean -fd -e .env -e package-lock.json -e node_modules -e logs

            # 🔒 بازیابی .env اگر پاک شد
            if [ ! -f .env ] && [ -f /tmp/optionhunter.env.backup ]; then
              echo "🔧 Restoring .env from backup"
              cp /tmp/optionhunter.env.backup .env
              chmod 600 .env
            fi

            if [ ! -f .env ]; then
              echo "❌❌❌ .env MISSING — deploy aborted"
              exit 1
            fi

            echo "=== npm install ==="
            npm install --no-audit --no-fund --prefer-offline

            echo "=== PM2 flush + restart ==="
            pm2 flush OptionHunter 2>/dev/null || true
            pm2 startOrRestart ecosystem.config.js --update-env
            pm2 save

            echo "=== Health check (polling تا ۶۰ ثانیه) ==="
            HEALTH_OK=0
            for i in $(seq 1 20); do
              sleep 3
              if curl -sfS --max-time 2 http://127.0.0.1:3000/ping > /tmp/oh_health.txt 2>/dev/null; then
                HEALTH_OK=1
                echo "✅ Deploy OK بعد از $((i * 3)) ثانیه — $(cat /tmp/oh_health.txt)"
                break
              fi
              # اگه اپ داره crash می‌کنه، سریع‌تر fail کن
              if pm2 jlist 2>/dev/null | grep -q '"status":"errored"'; then
                echo "❌ PM2 status errored — skip polling"
                break
              fi
              echo "  تلاش $i/20..."
            done

            echo ""
            echo "── PM2 status ──"
            pm2 status || true

            if [ "$HEALTH_OK" != "1" ]; then
              echo "⚠️  Health check ناکام — ولی PM2 restart انجام شد"
              echo "── PM2 logs (آخرین ۵۰ خط) ──"
              pm2 logs OptionHunter --lines 50 --nostream || true
              echo "── وضعیت پورت 3000 ──"
              sudo ss -tlnp 2>/dev/null | grep 3000 || echo "پورت 3000 گوش نمی‌ده"
              exit 1
            fi

            echo "✅ Deploy fully OK"