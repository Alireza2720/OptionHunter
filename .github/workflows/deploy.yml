name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 10m
          script: |
            set -e
            cd ~/apps/OptionHunter

            # 🔒 بکاپ .env قبل از هر کاری
            if [ -f .env ]; then
              cp .env /tmp/optionhunter.env.backup
              echo "✅ .env backed up"
            else
              echo "⚠️  .env not found before deploy"
            fi

            echo "=== Fetch ==="
            git fetch origin main
            git reset --hard origin/main
            git clean -fd -e ecosystem.config.js -e package-lock.json -e node_modules -e logs

            # 🔒 بازیابی .env (اول از .env موجود، بعد از بکاپ)
            if [ ! -f .env ] && [ -f /tmp/optionhunter.env.backup ]; then
              echo "🔧 Restoring .env from backup"
              cp /tmp/optionhunter.env.backup .env
            fi

            if [ ! -f .env ]; then
              echo "❌❌❌ .env MISSING — deploy aborted ❌❌❌"
              exit 1
            fi

            echo "=== npm install ==="
            npm install --prefix . --no-audit --no-fund --prefer-offline

            echo "=== PM2 restart ==="
            pm2 startOrRestart ecosystem.config.js --update-env
            pm2 save

            echo "=== Health check ==="
            sleep 8
            if ! curl -fsS http://127.0.0.1:3000/ping > /dev/null; then
              echo "❌ SERVER NOT RESPONDING — dumping logs"
              pm2 logs OptionHunter --lines 80 --nostream || true
              tail -50 ~/apps/OptionHunter/logs/error.log || true
              exit 1
            fi
            echo "✅ Deploy OK"