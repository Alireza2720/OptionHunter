name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 10m
          script: |
            set -e
            cd ~/apps/OptionHunter
            echo "=== Fetch ==="
            git fetch origin main
            git reset --hard origin/main
            git clean -fd -e ecosystem.config.js -e package-lock.json -e node_modules -e .env -e logs
            echo "=== npm install ==="
            npm install --prefix . --no-audit --no-fund --prefer-offline
            echo "=== PM2 restart ==="
            pm2 startOrRestart ecosystem.config.js --update-env
            pm2 save
            echo "=== Wait for boot ==="
            sleep 8
            echo "=== Health check ==="
            if ! curl -fsS http://127.0.0.1:3000/ping > /dev/null; then
              echo "❌ SERVER NOT RESPONDING - DUMPING LOGS"
              pm2 logs OptionHunter --lines 100 --nostream || true
              tail -100 ~/apps/OptionHunter/logs/error.log || true
              exit 1
            fi
            echo "=== ✅ Done ==="